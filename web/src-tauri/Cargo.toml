[package]
name = "taskrebuild-app"
version = "0.1.0"
description = "TaskRebuild Standalone Desktop Application"
authors = ["Mukesh"]
license = "MIT"
repository = "https://github.com/mukeshv-tech/Taskrebulid"
edition = "2021"
rust-version = "1.78"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
url = "2.5"
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-log = "2.0.0-rc"
