$kind: http-request
name: List Analyses
order: 2000
method: GET
url: '{{base_url}}/api/tasks/{{task_id}}/ai/analyses'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("Response is an array", () => {
        pm.expect(pm.response.json()).to.be.an("array");
      });
