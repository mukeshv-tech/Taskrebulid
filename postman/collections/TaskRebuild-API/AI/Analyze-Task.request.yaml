$kind: http-request
name: Analyze Task
order: 1000
method: POST
url: '{{base_url}}/api/tasks/{{task_id}}/ai/analyze'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("Analysis returned with id", () => {
        const json = pm.response.json();
        pm.expect(json.id).to.exist;
        pm.collectionVariables.set("analysis_id", json.id);
      });
