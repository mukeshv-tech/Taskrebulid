$kind: http-request
name: Health Check
order: 1000
method: GET
url: '{{base_url}}/health'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("API is healthy", () => {
        const json = pm.response.json();
        pm.expect(json.status).to.exist;
      });
