$kind: http-request
name: List Tasks
order: 1000
method: GET
url: '{{base_url}}/api/tasks'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("Response is an array", () => {
        pm.expect(pm.response.json()).to.be.an("array");
      });
