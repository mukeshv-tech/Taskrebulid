# GitLab CI/CD Pipeline with SAST & Secret Detection
stages:
  - test

variables:
  # Scan Python backend and TypeScript/React extension
  SAST_EXCLUDED_PATHS: "node_modules, dist, __pycache__, .venv"
  SEARCH_MAX_DEPTH: 10

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

secret_detection:
  stage: test
