# Supabase Configuration
project_id = "taskrebuild"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# Skip / disable automatic database seeding on branch creation and resets
[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "auto"

[studio]
enabled = true
port = 54323
api_role = "anon"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

# Edge functions deployment skipped
[edge_runtime]
enabled = false
