name: "CI - Tests, Linting & Build Verification"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: "Backend: Pytest & Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Python Lint (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other formatting warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: .
          SUPABASE_URL: "https://mock-supabase.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "mock-key"
        run: |
          python -m pytest tests/ -v

  frontend-extension:
    name: "Frontend: Typecheck, Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskrebuild/extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: taskrebuild/extension/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: ESLint Code Quality Check
        run: npx eslint . --ext ts,tsx --max-warnings 50

      - name: Build Chrome Extension (vite build)
        run: npm run build
