name: "Mirror to GitLab & Codeberg (Code, Issues & PRs)"

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  delete:
  pull_request:
    types: [ opened, synchronize, reopened, closed, edited ]
  pull_request_review_comment:
    types: [ created ]
  issues:
    types: [ opened, edited, closed, reopened, labeled, unlabeled ]
  issue_comment:
    types: [ created ]

# Concurrency group ensures events for the same issue/PR execute sequentially to avoid race conditions
concurrency:
  group: multi-cloud-sync-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Code Mirroring Job (Branches, PR Refs & Branch Deletions)
  sync-git:
    name: "Sync Code Branches & PRs"
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'delete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret not configured in GitHub repository secrets."
            exit 1
          fi

          # Configure GitLab Remote
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/mukeshv-tech/taskrebulid.git"
          
          echo "Syncing branches and tags to GitLab with prune..."
          git push --prune --force gitlab "+refs/remotes/origin/*:refs/heads/*"
          git push --tags gitlab

          # Handle explicit branch deletion event
          if [ "${{ github.event_name }}" = "delete" ] && [ "${{ github.event.ref_type }}" = "branch" ]; then
            DEL_BRANCH="${{ github.event.ref }}"
            echo "Branch '$DEL_BRANCH' was deleted on GitHub. Deleting on GitLab..."
            git push gitlab --delete "$DEL_BRANCH" || true
          fi

          # If triggered by a Pull Request, mirror the specific PR branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_BRANCH="pr-${{ github.event.pull_request.number }}"
            echo "Mirroring PR #${{ github.event.pull_request.number }} branch ($PR_BRANCH) to GitLab..."
            git checkout -b "$PR_BRANCH" "${{ github.sha }}"
            git push --force gitlab "$PR_BRANCH"
          fi

      - name: Mirror Code to Codeberg
        if: env.CODEBERG_TOKEN != ''
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          echo "Syncing code branches and tags to Codeberg with prune..."
          git remote add codeberg "https://${CODEBERG_TOKEN}@codeberg.org/mukeshv-tech/taskrebulid.git"
          
          # Push remote-tracking branches and tags, pruning stale deleted branches from Codeberg
          git push --prune --force codeberg "+refs/remotes/origin/*:refs/heads/*"
          git push --tags codeberg

          # Handle explicit branch deletion event
          if [ "${{ github.event_name }}" = "delete" ] && [ "${{ github.event.ref_type }}" = "branch" ]; then
            DEL_BRANCH="${{ github.event.ref }}"
            echo "Branch '$DEL_BRANCH' was deleted on GitHub. Deleting on Codeberg..."
            git push codeberg --delete "$DEL_BRANCH" || true
          fi

          # If triggered by a Pull Request, mirror the specific PR branch to Codeberg
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_BRANCH="pr-${{ github.event.pull_request.number }}"
            echo "Mirroring PR #${{ github.event.pull_request.number }} branch ($PR_BRANCH) to Codeberg..."
            git checkout -b "$PR_BRANCH" "${{ github.sha }}" 2>/dev/null || git checkout "$PR_BRANCH"
            git push --force codeberg "$PR_BRANCH"
          fi

  # 2. Issues, PRs, and Comments API Sync Job
  sync-issues:
    name: "Sync Issues, PRs & Comments to GitLab & Codeberg"
    # Ensure code branches and PR branches are mirrored first before creating Merge Requests / Pull Requests
    needs: [sync-git]
    if: always() && (needs.sync-git.result == 'success' || needs.sync-git.result == 'skipped') && (github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request' || github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run GitLab Sync Engine
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: "88286291"
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python .github/scripts/gitlab_sync.py

      - name: Run Codeberg PR Sync Engine
        if: github.event_name == 'pull_request' && env.CODEBERG_TOKEN != ''
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO: "mukeshv-tech/taskrebulid"
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python .github/scripts/codeberg_sync.py
