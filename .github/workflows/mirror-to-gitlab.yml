name: "Mirror to GitLab (Code & Issues)"

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    types: [ opened, synchronize, reopened, closed, edited ]
  pull_request_review_comment:
    types: [ created ]
  issues:
    types: [ opened, edited, closed, reopened, labeled, unlabeled ]
  issue_comment:
    types: [ created ]

# Concurrency group ensures events for the same issue/PR execute sequentially to avoid race conditions
concurrency:
  group: gitlab-sync-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Code Mirroring Job (Branches & PR Refs)
  sync-git:
    name: "Sync Code Branches & PRs"
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret not configured in GitHub repository secrets."
            exit 1
          fi

          # Configure GitLab Remote
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/mukeshv-tech/taskrebulid.git"
          
          echo "Syncing all branches and tags to GitLab..."
          git push --prune gitlab "+refs/remotes/origin/*:refs/heads/*"
          git push --tags gitlab

          # If triggered by a Pull Request, mirror the specific PR branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_BRANCH="pr-${{ github.event.pull_request.number }}"
            echo "Mirroring PR #${{ github.event.pull_request.number }} branch ($PR_BRANCH) to GitLab..."
            git checkout -b "$PR_BRANCH" "${{ github.sha }}"
            git push --force gitlab "$PR_BRANCH"
          fi

      - name: Mirror Code to Codeberg
        if: env.CODEBERG_TOKEN != ''
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          echo "Syncing code branches and tags to Codeberg..."
          git remote add codeberg "https://${CODEBERG_TOKEN}@codeberg.org/mukeshv-tech/Taskrebulid.git"
          git push --prune codeberg "+refs/remotes/origin/*:refs/heads/*"
          git push --tags codeberg

  # 2. Issues, PRs, and Comments API Sync Job
  sync-issues:
    name: "Sync Issues, PRs & Comments to GitLab"
    if: github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request' || github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run GitLab Sync Engine
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: "88286291"
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python .github/scripts/gitlab_sync.py
